{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sec Manager">
    <!-- <link rel="shortcut icon" href="/images/favicon.ico"> -->

    <title>{{ .Title }} - Sec Manager</title>

    <link href="/css/dist/sec_manager.css" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Roboto:700,500' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,300,600,700' rel='stylesheet' type='text/css'>
    <script>
        {{if .User}}
    var user = {
        id: {{ .User.Id }},
        username: {{ .User.Username }},
        api_key: {{ .User.ApiKey }},
        role: {
            id: {{ .User.RoleID }},
            slug: {{ .User.Role.Slug }}
        },
        tenant: {
            id: {{ .User.TenantID }},
            name: {{ .User.Tenant.Name }}
        },
        provider_tenants: [
            {{range .User.ProviderTenants}}
            {
                id: {{ .ID }},
                display_name: {{ .DisplayName }},
                provider_tenant_id: {{ .ProviderTenantID }},
                type: {{ .ProviderType }}
            },
            {{end}}
        ]
        // ...add more fields as needed
    }
    {{end}}
    {{if .Token}}
        var csrf_token = {{.Token}}
    {{end}}
    </script>
</head>

<body>
    <div class="navbar navbar-inverse navbar-fixed-top" role="navigation">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <!-- <img class="navbar-logo" src="/images/logo_inv_small.png" /> -->
                <a class="navbar-brand" href="/">&nbsp;sec manager</a>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li>
                        {{if .User}}
                        <div class="btn-group" id="navbar-dropdown">
                            <a class="btn btn-primary" href="/settings"><i class="fa fa-user"></i> {{.User.Username}}</a>
                            <a class="btn btn-primary dropdown-toggle" href="/logout">
                                <i class="fa fa-sign-out"></i>
                            </a>
                        </div>
                        {{else}}
                        <a href="/login">
                            <button type="button" class="btn btn-primary">Login</button>
                        </a>
                        {{end}}
                    </li>
                </ul>
            </div>
        </div>
    </div>
    {{template "nav" .}}
    {{template "body" .}}
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
    <script src="/js/dist/app/sec_manager.min.js"></script>
    {{template "scripts" .}}
</body>

</html>
{{ end }}
